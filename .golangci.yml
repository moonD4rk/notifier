version: "2"
run:
  modules-download-mode: readonly
  allow-parallel-runners: true
linters:
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocritic
    - godox
    - goheader
    - goprintffuncname
    - gosec
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - thelper
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  disable:
    - noctx
    - paralleltest
    - sqlclosecheck
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          deny:
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
    dogsled:
      max-blank-identifiers: 3
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - os.Remove
        - os.RemoveAll
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
      package-scope-only: true
      explicit-exhaustive-map: true
      explicit-exhaustive-switch: true
    forbidigo:
      forbid:
        - pattern: ^print.*$
        - pattern: ^fmt\.Print.*$
          msg: Do not commit print statements.
      exclude-godoc-examples: true
    funlen:
      lines: 120
      statements: 50
      ignore-comments: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      settings:
        captLocal:
          paramsOnly: false
        elseif:
          skipBalanced: false
        ifElseChain:
          minThreshold: 4
        nestingReduce:
          bodyWidth: 4
        rangeExprCopy:
          sizeThreshold: 516
          skipTestFuncs: false
        tooManyResultsChecker:
          maxResults: 10
        truncateCmp:
          skipArchDependent: false
        underef:
          skipRecvDeref: false
        unnamedResult:
          checkExported: true
    godox:
      keywords:
        - NOTE
        - OPTIMIZE
        - HACK
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
      settings:
        unusedresult: {}
    sloglint:
      no-mixed-args: false
      kv-only: true
      static-msg: true
      no-raw-keys: false
      key-naming-case: snake
      args-on-sep-lines: false
    usestdlibvars:
      http-method: false
      http-status-code: false
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: should have a package comment
      - path: (.+)\.go$
        text: should have comment
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/moond4rk/notifier)
        - blank
        - dot
        - alias
      custom-order: true
    goimports:
      local-prefixes:
        - github.com/moond4rk/notifier
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
